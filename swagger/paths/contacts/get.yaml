tags:
  - Contacts
summary: Get contacts
operationId: getContacts
description: Get contacts
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema:
      type: integer
      default: 1
    description: Page number
  - in: query
    name: perPage
    schema:
      type: integer
      default: 10
    description: Number of contacts per pag
  - in: query
    name: sortBy
    schema:
      type: string
      default: name
    description: Sort contacts by field name
  - in: query
    name: sortOrder
    schema:
      type: string
      enum: ['asc', 'desc']
      default: asc
    description: Sort order
  - in: query
    name: type
    schema:
      type: string
      enum: ['home', 'personal']
    description: Sort type
  - in: query
    name: isFavourite
    schema:
      type: boolean
    description: Is contact favourite
responses:
  '200':
    description: 'Successfully found contacts!'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              required:
                - data
                - page
                - perPage
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
              properties:
                data:
                  type: array
                  items:
                    $ref: ../../components/schemas/contact.yaml
                page:
                  type: integer

                perPage:
                  type: integer

                totalItems:
                  type: integer

                totalPages:
                  type: integer

                hasNextPage:
                  type: boolean

                hasPreviousPage:
                  type: boolean

  '401':
    $ref: ../../components/responses/401.yaml
  '500':
    $ref: ../../components/responses/500.yaml
